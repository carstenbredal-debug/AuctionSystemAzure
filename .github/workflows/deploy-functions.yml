name: Deploy Azure Functions

on:
  push:
    branches:
      - base-init
    paths:
      - 'src/AuctionSystem.Functions/**'
      - 'src/AuctionSystem.Domain/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AuctionSystem.Functions

      - name: Build
        run: dotnet build src/AuctionSystem.Functions --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AuctionSystem.Functions --configuration Release --output ./publish

      - name: Create deployment package
        run: cd publish && zip -r ../deploy.zip .

      - name: Deploy to Azure Functions
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          # Extract credentials from publish profile
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          PUBLISH_URL=$(echo "$PUBLISH_PROFILE" | grep -oP 'publishUrl="\K[^"]+' | head -1)

          echo "Deploying to: $PUBLISH_URL"

          # Deploy using Kudu ZipDeploy REST API directly
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -u "$USERNAME:$PASSWORD" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/zip" \
            "https://$PUBLISH_URL/api/zipdeploy?isAsync=true")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deployment initiated successfully!"
            # Wait for deployment to complete
            sleep 30
            echo "Deployment complete."
          else
            echo "::error::Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
