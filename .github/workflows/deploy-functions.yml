name: Deploy Azure Functions

on:
  push:
    branches:
      - base-init
    paths:
      - 'src/AuctionSystem.Functions/**'
      - 'src/AuctionSystem.Domain/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'Auctionsystemazure'
  AZURE_FUNCTIONAPP_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AuctionSystem.Functions

      - name: Build
        run: dotnet build src/AuctionSystem.Functions --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AuctionSystem.Functions --configuration Release --output ./publish

      - name: Create deployment package
        run: cd publish && zip -r ../deploy.zip .

      - name: Azure Login
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_FUNCTIONAPP_RESOURCE_GROUP }} \
            --src deploy.zip \
            --build-remote false
