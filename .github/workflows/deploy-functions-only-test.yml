name: Deploy Functions ONLY (TEST)

# Manual, function-only deploy for standing up TEST — deploys just the auction Function App
# (no SWAs, no KSeF), so you can validate the function + DB (managed identity) in isolation
# before the rest of the environment exists. Run it from the Actions tab → "Run workflow".
on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/AuctionSystem.Functions'
  DOTNET_VERSION: '8.0'

jobs:
  build_and_deploy_functions:
    runs-on: ubuntu-latest
    name: Build and Deploy Functions (TEST, manual)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish project
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: Create deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_TEST }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_TEST }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME_TEST }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_TEST }} \
            --src ${{ github.workspace }}/deploy.zip \
            --build-remote false
