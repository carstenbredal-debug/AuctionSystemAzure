name: Deploy TEST

on:
  push:
    branches:
      - test
    paths-ignore:
      - 'ksef/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - test
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/AuctionSystem.Functions'
  DOTNET_VERSION: '8.0'
  ENVIRONMENT: 'test'
  # TEST auth tenants (not secrets) — used to rewrite the SWA auth config per-environment.
  AAD_ISSUER_TENANT_TEST: '982dbb71-b602-4c81-a7a7-d2244f22bc65'
  EXTERNAL_CIAM_TENANT_TEST: '8de8e158-e70a-49e4-b28b-7cf70917dc4a'

jobs:
  build_and_deploy_functions:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Functions (TEST)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish project
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: Create deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_TEST }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_TEST }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME_TEST }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_TEST }} \
            --src ${{ github.workspace }}/deploy.zip \
            --build-remote false

  build_and_deploy_swa:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy SWA (TEST)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set environment-specific API URL
        run: |
          echo '{ "ApiBaseUrl": "" }' > src/AuctionSystem.Web/wwwroot/appsettings.json

      - name: Point auth providers at the TEST tenants
        run: |
          CFG=src/AuctionSystem.Web/wwwroot/staticwebapp.config.json
          WK="https://${EXTERNAL_CIAM_TENANT_TEST}.ciamlogin.com/${EXTERNAL_CIAM_TENANT_TEST}/v2.0/.well-known/openid-configuration"
          jq --arg iss "https://login.microsoftonline.com/${AAD_ISSUER_TENANT_TEST}/v2.0" \
             --arg wk "$WK" \
             '.auth.identityProviders.azureActiveDirectory.registration.openIdIssuer = $iss
              | .auth.identityProviders.customOpenIdConnectProviders.externalid.registration.openIdConnectConfiguration.wellKnownOpenIdConfiguration = $wk' \
             "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
          echo "internal openIdIssuer:"
          jq -r '.auth.identityProviders.azureActiveDirectory.registration.openIdIssuer' "$CFG"
          echo "external wellKnownOpenIdConfiguration:"
          jq -r '.auth.identityProviders.customOpenIdConnectProviders.externalid.registration.openIdConnectConfiguration.wellKnownOpenIdConfiguration' "$CFG"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/AuctionSystem.Web"
          api_location: ""
          output_location: "wwwroot"

  build_and_deploy_catalog_swa:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Catalog SWA (TEST)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set environment-specific API URL
        run: |
          echo '{ "ApiBaseUrl": "${{ secrets.API_BASE_URL_TEST }}" }' > src/LotCatalogWeb/wwwroot/appsettings.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_CATALOG_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/LotCatalogWeb"
          api_location: ""
          output_location: "wwwroot"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request (Admin SWA)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          action: "close"

      - name: Close Pull Request (Catalog SWA)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_CATALOG_TEST }}
          action: "close"
