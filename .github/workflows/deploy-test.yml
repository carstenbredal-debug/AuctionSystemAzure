name: Deploy TEST

on:
  push:
    branches:
      - test
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - test

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/AuctionSystem.Functions'
  DOTNET_VERSION: '8.0'
  ENVIRONMENT: 'test'

jobs:
  build_and_deploy_functions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Functions (TEST)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish project
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: Create deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_TEST }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_TEST }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME_TEST }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_TEST }} \
            --src ${{ github.workspace }}/deploy.zip \
            --build-remote false

  build_and_deploy_swa:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy SWA (TEST)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set environment-specific API URL
        run: |
          echo '{ "ApiBaseUrl": "${{ secrets.API_BASE_URL_TEST }}" }' > src/AuctionSystem.Web/wwwroot/appsettings.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/AuctionSystem.Web"
          api_location: ""
          output_location: "wwwroot"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          action: "close"
