name: Deploy BC Extension

on:
  push:
    branches:
      - dev
    paths:
      - 'bc-extension/src/**'
      - 'bc-extension/app.json'
      - '.github/workflows/deploy-bc-extension.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0'
  AL_COMPILER_VERSION: '17.0.34.45391'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy BC Extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install AL Compiler
        run: |
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --version ${{ env.AL_COMPILER_VERSION }} || true
          # Find the AL compiler
          ALC_PATH=$(find ~/.dotnet/tools/.store -name "alc.dll" -path "*/net8.0/*" 2>/dev/null | head -1)
          if [ -z "$ALC_PATH" ]; then
            # Try NuGet package cache
            ALC_PATH=$(find ~/.nuget/packages/microsoft.dynamics.businesscentral.development.tools -name "alc.dll" -path "*/net8.0/any/*" 2>/dev/null | head -1)
          fi
          if [ -z "$ALC_PATH" ]; then
            echo "AL compiler not found, installing via NuGet..."
            mkdir -p /tmp/alc
            cd /tmp/alc
            dotnet new console --force
            dotnet add package Microsoft.Dynamics.BusinessCentral.Development.Tools --version ${{ env.AL_COMPILER_VERSION }}
            dotnet restore
            ALC_PATH=$(find ~/.nuget/packages/microsoft.dynamics.businesscentral.development.tools -name "alc.dll" -path "*/net8.0/any/*" 2>/dev/null | head -1)
          fi
          echo "ALC_PATH=$ALC_PATH" >> $GITHUB_ENV
          echo "Found AL compiler at: $ALC_PATH"

      - name: Download BC Symbols
        env:
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID_DEV }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID_DEV }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET_DEV }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT_DEV }}
        run: |
          cd bc-extension
          mkdir -p .alpackages
          
          echo "Getting OAuth token..."
          TOKEN_RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/${BC_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${BC_CLIENT_ID}" \
            -d "client_secret=${BC_CLIENT_SECRET}" \
            -d "scope=https://api.businesscentral.dynamics.com/.default" \
            -d "grant_type=client_credentials")
          
          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to get OAuth token. Response:"
            echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error','unknown'), '-', d.get('error_description','no details'))" 2>/dev/null || echo "$TOKEN_RESPONSE"
            exit 1
          fi
          echo "OAuth token obtained successfully."
          
          echo "Downloading symbols from BC environment '${BC_ENVIRONMENT}'..."
          DOWNLOAD_OK=true
          
          for APP_NAME in "System" "Application" "Base Application" "System Application"; do
            CLEAN_NAME=$(echo "$APP_NAME" | sed 's/ /_/g')
            URL_NAME=$(echo "$APP_NAME" | sed 's/ /%20/g')
            echo "  Downloading $CLEAN_NAME..."
            HTTP_CODE=$(curl -s -o ".alpackages/${CLEAN_NAME}.app" -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.businesscentral.dynamics.com/v2.0/${BC_TENANT_ID}/${BC_ENVIRONMENT}/dev/packages?publisher=Microsoft&appName=${URL_NAME}&versionText=0.0.0.0")
            FILE_SIZE=$(stat -c%s ".alpackages/${CLEAN_NAME}.app" 2>/dev/null || echo 0)
            echo "    HTTP $HTTP_CODE, size: $FILE_SIZE bytes"
            if [ "$HTTP_CODE" != "200" ] || [ "$FILE_SIZE" -lt 1000 ]; then
              echo "    WARNING: Download failed. Content:"
              head -c 500 ".alpackages/${CLEAN_NAME}.app" | cat -v
              echo
              DOWNLOAD_OK=false
            fi
          done
          
          if [ "$DOWNLOAD_OK" = "false" ]; then
            echo ""
            echo "ERROR: Symbol download failed. Check:"
            echo "  1. BC_ENVIRONMENT_DEV matches exact BC environment name"
            echo "  2. App has 'EXTEN. MGT. - ADMIN' permission in BC"
            echo "  3. App has 'D365 EXTENSION MGT' permission in BC"
            exit 1
          fi
          
          ls -la .alpackages/

      - name: Compile AL Extension
        run: |
          cd bc-extension
          echo "Compiling AL extension..."
          dotnet "${{ env.ALC_PATH }}" /project:. /packagecachepath:.alpackages /out:AuctionSystemLedgerAPI.app
          ls -la AuctionSystemLedgerAPI.app

      - name: Deploy to Business Central
        env:
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID_DEV }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID_DEV }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET_DEV }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT_DEV }}
        run: |
          cd bc-extension
          bash deploy.sh AuctionSystemLedgerAPI.app
