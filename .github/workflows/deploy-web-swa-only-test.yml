name: Deploy Web SWA ONLY (TEST)

# Manual, admin-web-only deploy for standing up TEST — deploys just the AuctionSystem.Web
# Static Web App (no function, no catalog, no KSeF), so you can validate the admin SWA +
# its linked-backend API connection in isolation. Run from the Actions tab → "Run workflow".
on:
  workflow_dispatch:

env:
  # TEST internal Entra tenant (where the AAD_CLIENT_ID app reg lives). Not a secret.
  AAD_ISSUER_TENANT_TEST: '982dbb71-b602-4c81-a7a7-d2244f22bc65'
  # TEST external CIAM tenant (where the EXTERNAL_AAD_CLIENT_ID app reg lives). Not a secret.
  EXTERNAL_CIAM_TENANT_TEST: '8de8e158-e70a-49e4-b28b-7cf70917dc4a'

jobs:
  build_and_deploy_web_swa:
    runs-on: ubuntu-latest
    name: Build and Deploy Admin SWA (TEST, manual)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set environment-specific API URL
        run: |
          echo '{ "ApiBaseUrl": "", "Environment": "TEST" }' > src/AuctionSystem.Web/wwwroot/appsettings.json

      - name: Point auth providers at the TEST tenants
        run: |
          CFG=src/AuctionSystem.Web/wwwroot/staticwebapp.config.json
          WK="https://${EXTERNAL_CIAM_TENANT_TEST}.ciamlogin.com/${EXTERNAL_CIAM_TENANT_TEST}/v2.0/.well-known/openid-configuration"
          jq --arg iss "https://login.microsoftonline.com/${AAD_ISSUER_TENANT_TEST}/v2.0" \
             --arg wk "$WK" \
             '.auth.identityProviders.azureActiveDirectory.registration.openIdIssuer = $iss
              | .auth.identityProviders.customOpenIdConnectProviders.externalid.registration.openIdConnectConfiguration.wellKnownOpenIdConfiguration = $wk' \
             "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
          echo "internal openIdIssuer:"
          jq -r '.auth.identityProviders.azureActiveDirectory.registration.openIdIssuer' "$CFG"
          echo "external wellKnownOpenIdConfiguration:"
          jq -r '.auth.identityProviders.customOpenIdConnectProviders.externalid.registration.openIdConnectConfiguration.wellKnownOpenIdConfiguration' "$CFG"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/AuctionSystem.Web"
          api_location: ""
          output_location: "wwwroot"
