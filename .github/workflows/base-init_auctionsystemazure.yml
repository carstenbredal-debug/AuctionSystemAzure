# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - Auctionsystemazure

on:
  push:
    branches:
      - base-init
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/AuctionSystem.Functions'
  DOTNET_VERSION: '8.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Publish project'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: 'Create deployment package'
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E8AA5F9DBDC340F1BE5460EFEB32D72C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_286EA316E3A844B58BDF711457511A4F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4DB58356E71E4A159489E77853B52456 }}

      - name: 'Deploy to Azure Functions'
        run: |
          az functionapp deployment source config-zip \
            --name Auctionsystemazure \
            --resource-group ITTEST \
            --src ${{ github.workspace }}/deploy.zip \
            --build-remote false
